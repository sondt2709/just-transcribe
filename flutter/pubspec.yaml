name: just_transcribe
description: "Real-time audio transcription and translation for mobile."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.2.0
  flutter_foreground_task: ^9.2.2
  flutter_onnxruntime: ^1.6.0
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/silero_vad.onnx
